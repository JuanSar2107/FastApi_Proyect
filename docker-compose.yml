services:
  api:
    build: .
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    environment:
      - DATABASE_URL=sqlite:////app/data/inventario.db
      - PORT=${PORT:-5050}
      # Orígenes CORS permitidos, separados por comas (sin "*")
      - CORS_ORIGINS=${CORS_ORIGINS:-https://flutter.proyecto.lol,https://www.flutter.proyecto.lol,http://localhost:8044,http://127.0.0.1:8044}
    volumes:
      - inventory_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-5050}/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  inventory_data:
