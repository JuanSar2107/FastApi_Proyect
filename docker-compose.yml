services:
  api:
    build: .
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: sqlite:////app/data/inventario.db
    volumes:
      - inventory_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  inventory_data:
